[package]
name = "adaptif"
version = "0.2.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
rand_distr = "0.6.0"
pyo3 = { version = "0.29.0", optional = true, features = ["multiple-pymethods"] }
numpy = { version = "0.29.0", optional = true }

[lib]
name = "adaptif"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[lints.clippy]
pedantic = {level = "warn", priority = -1}
restriction = {level = "warn", priority = -1}
blanket_clippy_restriction_lints = "allow"
allow_attributes = "allow"

# no-brainers
arithmetic_side_effects = "allow" # otherwise we get warnings about potential overflows on _every_ arithmetic op
float_arithmetic = "allow" # used by algorithms
implicit_return = "allow" # leaving out the `return` keyword is idiomatic
must_use_candidate = "allow" # just shows where #[must_use] can be used
single_call_fn = "allow" # functions are useful for code organization and self-documentation
question_mark_used = "allow" # greatly simplifies error handling
absolute_paths = "allow" # fine if used within reason
arbitrary_source_item_ordering = "allow" # conflicts with optimizing structs for cache locality
missing_trait_methods = "allow" # should only be used on individual trait implementations, not globally
single_char_lifetime_names = "allow" # idiomatic

# only relevant to no_std. For embedded support, we could turn these on for the relevant modules
std_instead_of_alloc = "allow" 
std_instead_of_core = "allow"

# good to have
min_ident_chars = "allow" # to represent single-character variables used in literature
shadow_reuse = "allow" # variable shadowing is useful
default_numeric_fallback = "allow" # many false positives
separated_literal_suffix = "allow" # easier to read than unseparated
pub_use = "allow" # it's neater to keep public items in their own modules than keep them all in one mod.rs file
mod_module_files = "allow" # modules should be self-contained to a directory
let_underscore_untyped = "allow" # if we aren't going to use a return value, we generally don't care about its type
error_impl_error = "allow" # Naming errors just "Error" and using them as `some_module::Error` matches the standard library
pub_with_shorthand = "allow" # Allows for macros do be shared within the same crate using the pub(crate) ... shorthand


# maybe
missing_docs_in_private_items = "allow"

# Requires short functions to be explicitly inlined, because automatic inlining can't be done across crates w/o LTO. 
# This may be worth considering for the pure Rust API, but for PyO3 it's irrelevant.
# Since inlining is done at the call site, this only applies to public functions anyway.
missing_inline_in_public_items = "allow" 

# This one is supposed to skip test modules (#[cfg(test)]), but as of 1.98.0 it only works on nightly.
inline_modules = "allow"


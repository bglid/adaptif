name: Python CI

on:
  push:
    paths:
      - "python/**"
      - "tests/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/integration-ci.yml"
      - "tests/setup_integration_data.py"
  pull_request:
    paths:
      - "python/**"
      - "tests/python/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/integration-ci.yml"
      - "tests/setup_integration_data.py"

jobs:
  prepare-data:
    uses: ./.github/workflows/integration-ci.yml

  build:
    runs-on: ubuntu-latest
    needs: prepare-data
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Generate Python bindings
        run: uv run maturin develop

      - name: Run style checks
        run: |
          uv run ruff check . --fix
          uv run ruff format --check .

      - name: Run type checks
        run: uv run ty check

      - name: Run unit tests
        run: make test-py-unit

      - name: Restore integration data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: integration-data-v1-${{ hashFiles('tests/setup_integration_data.py') }}

      - name: Run integration tests
        run: make test-py-integration

      - name: Run safety checks
        run: uv audit

      - name: Build package
        run: uv build

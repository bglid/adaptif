name: Integration CI

on:
  workflow_call:

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Restore integration data
        id: cache-data
        uses: actions/cache@v4
        with:
          path: tests/data
          key: integration-data-v1-${{ hashFiles('tests/setup_integration_data.py')}}

      - name: Generate data
        if: steps.cache-data.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1
          uv run tests/setup_integration_data.py

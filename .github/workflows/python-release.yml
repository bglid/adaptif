name: Wheels

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build SDist
        uses: PyO3/maturin-action@v1.51.0
        with:
          sccache: false
          maturin-version: v1.15.0
          command: sdist
          args: --out dist

      # Ref: https://github.com/astral-sh/github-actions/tree/main/release-smoke-test
      - name: "Test sdist"
        # using uv's setup for this
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: python:3.11-bookworm@sha256:35d3a4a3d5e42e02ab916d44513a050689f12c0533d45598d229672503fe77ca
          artifacts: dist
          rust-toolchain: rust-toolchain.toml
          run: |
            python -m pip install \
              /dist/adaptif-*.tar.gz \
              --force-reinstall \
              --config-settings=maturin.build-args=--locked
            python -c "import adaptif; print(adaptif.__file__)"

      - name: "Upload sdist"
        uses: actions/upload-artifact@v7
        with:
          name: build-sdist-adaptif
          path: dist

  build_wheels:
    name: Wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python versions
        if: runner.os != 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.15

      - name: Build Wheels
        uses: PyO3/maturin-action@v1.51.0
        with:
          sccache: true
          maturin-version: v1.15.0
          manylinux: "2_28"
          args: --release --locked --out dist --compatibility pypi --find-interpreter

      # Ref: https://github.com/astral-sh/github-actions/tree/main/release-smoke-test
      - name: "Test wheels"
        # using uv's setup for this
        uses: astral-sh/github-actions/release-smoke-test@76d2758fc5c4394ada46510f46605deb7cec477e
        with:
          image: python:3.11-bookworm@sha256:35d3a4a3d5e42e02ab916d44513a050689f12c0533d45598d229672503fe77ca
          artifacts: dist
          run: |
            python -m pip install "numpy>=1.26.4"
            python -m pip install \
              --no-index \
              --no-deps \
              --find-links dist \
              --force-reinstall \
              --only-binary=:all: \
              adaptif

            python -c "from adaptif import LMSFilter, NLMSFilter, RLSFilter"

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: build-wheels-adaptif-${{ matrix.os }}
          path: dist

  upload_all:
    needs: [sdist, build_wheels]
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read

    runs-on: ubuntu-24.04
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@release/v1

default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.5.0
    hooks:
      - id: check-yaml

  # Python
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff-lint
        entry: uv run ruff check --fix
        types: [python]
        language: system

      - id: ruff-fmt
        name: ruff-fmt
        entry: uv run ruff format --check
        types: [python]
        language: system

  # Rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        types: [rust]
        language: system
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check
        types: [rust]
        language: system
        pass_filenames: false
      
      - id: clippy
        name: clippy 
        entry: cargo clippy --all-targets --all-features -- -Dwarnings
        types: [rust]
        language: system
        pass_filenames: false
